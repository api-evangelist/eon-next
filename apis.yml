name: E.ON Next
kind: company
description: >-
  E.ON Next Energy Limited is the United Kingdom retail supply arm of the
  E.ON Group, formed after E.ON's 2019 acquisition of npower and serving roughly five
  million British households and small businesses with electricity, gas, smart meters,
  solar, home batteries, heat pumps and EV charging tariffs. It sits at the retail
  end of the GB energy value chain — buying wholesale, settling through Elexon, reading
  SMETS2 smart meters over the licensed Smart DCC network, and billing the customer
  — and it runs its entire operation on Kraken, the API-first, GraphQL-based energy
  operating system licensed from Kraken Technologies (Octopus Energy Group), onto which
  5.8 million customers were migrated between June 2020 and June 2022. Its API posture
  is the exact opposite of its platform's reputation: the Kraken architecture underneath
  is API-first, but almost nothing is published outward. There is no developer portal,
  no API documentation, no OpenAPI, and no third-party route to a customer's usage or
  billing data; developer.eonnext.com and docs.eonnext.com do not resolve, and both
  api.eonnext.com and data.eonnext.com answer every path with an unauthenticated AWS API
  Gateway 403 "Missing Authentication Token". The one machine-readable contract E.ON Next
  does publish is its customer identity layer — auth.eonnext.com, an Auth0 CIAM tenant,
  serves a complete anonymous OpenID Connect / RFC 8414 discovery document and JWKS —
  which describes how a customer signs in, not how a developer gets access. Britain
  mandated the metering infrastructure, not the data right: E.ON Next is bound by the
  Smart Energy Code and the DCC, which is live and implemented, but no consumer
  data-portability mandate equivalent to Australia's CDR or Ontario's Green Button applies
  to it, and none of the open GB market data (NESO Carbon Intensity, Elexon BSC, DNO
  open-data portals) originates here. Consumer data is closed, market data is published by
  other parties, and the only public contract is identity.
