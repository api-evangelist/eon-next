apis:
- aid: eon-next:identity
  name: E.ON Next Customer Identity (OpenID Connect)
  description: >-
    The OpenID Connect / OAuth 2.0 authorization server that authenticates E.ON Next
    customers into the online account and mobile app. It is an Auth0-hosted E.ON group
    CIAM tenant (certificate CN eon-next-uk.eon-ciam.auth0app.com, Cloudflare edge) and it
    serves a complete OIDC Discovery document, the RFC 8414 authorization-server metadata
    alias, and the signing JWKS anonymously — so its grants, endpoints, client
    authentication methods (including private_key_jwt and mTLS with certificate-bound
    tokens), PKCE, device flow, CIBA, DPoP and MFA challenge surface are observable fact
    rather than inference. This is NOT a developer programme: no client registration path
    is documented for third parties, no resource server or domain scope is advertised, and
    no energy data is reachable through it. It is catalogued because it is the only
    machine-readable contract E.ON Next publishes.
  humanURL: https://www.eonnext.com/dashboard/sign-in
  baseURL: https://auth.eonnext.com/
  tags:
  - Identity
  - Authentication
  - OpenID Connect
  - OAuth 2.0
