regulatory:
  regime: >-
    Great Britain Smart Metering Implementation Programme — Smart Energy Code
    (SEC) and the licensed Data Communications Company (DCC), under Ofgem supply
    licence conditions.
  status: live-implemented (infrastructure obligation only)
  produces_supplier_api: false
  note: >-
    Britain mandated the metering pipes, not a consumer data right. SMETS2 meters
    and the DCC are live; no consumer data-portability API obligation exists for
    a GB supplier. DESNZ's "Developing an energy smart data scheme" call for
    evidence closed 10 March 2025 with no published government response, and no
    energy secondary legislation has been made under the Data (Use and Access)
    Act 2025. Third-party access to GB smart-meter data runs through the DCC
    "Other User" role and SEC party status, not through E.ON Next.
compliance_program:
  published_certifications: []
  note: >-
    No trust centre and no published SOC 2 / ISO 27001 / PCI DSS / CSA STAR
    attestation page was found on any E.ON Next host (probe-security-programs
    returned trust=none on 2026-07-27; www.eon.com group security pages answer
    403 to machine clients). No Compliance pointer is claimed in apis.yml.
