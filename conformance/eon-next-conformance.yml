- id: fhir
  conforms: false
- id: green-button-espi
  name: Green Button / NAESB ESPI
  conforms: false
  evidence: No Green Button or ESPI reference on any eonnext.com host, and no Green Button Alliance certification. Green Button is a North American standard.
- id: cdr-consumer-data-standards
  name: Australian Consumer Data Right (energy)
  conforms: false
  evidence: E.ON Next is a GB entity; CDR designation and the Consumer Data Standards do not apply.
- id: ocpp-ocpi
  conforms: false
  evidence: >-
    No charge-point or roaming protocol surface is published despite E.ON Next
