  notWritten:
    openapi: no spec exists on any host
    graphql: reachable only as an AWS API Gateway 403; introspection impossible
    asyncapi: no event, streaming or webhook surface
    packages: no first-party SDK in any registry
    cli: none published
    sandbox: none published
    changelog: none published
    lifecycle: no status page, no versioning policy, no deprecation policy — status.eonnext.com does not resolve
    mcp: no server, and no OpenAPI to derive candidate tools from
    skills: no OpenAPI to ground an agent skill in
    conventions: no documented request/response semantics
    errors: only the AWS API Gateway "Missing Authentication Token" body is observable
    trustCenter: no trust/compliance portal; no named certifications published
actions:
  apisYmlUpdated: true
  apisListed: 1
  apisListedNote: >-
    Round 2 lists one API — the E.ON Next Customer Identity (OpenID Connect)
    authorization server at https://auth.eonnext.com/ — on the strength of its
    anonymous, complete discovery document. It is catalogued as identity, not as
    a developer programme.
  openapiHarvested: false
  specsCount: 0
  openapiDirectoryCreated: false
  reason: >-
    Nothing real was found to save. Every candidate contract path on every candidate
    host returned 403 (AWS API Gateway, no body beyond the error) or 404, and the
    company's own sitemap contains no developer surface at all. Fabricating an
    endpoint, a spec, or a scope would have been the only way to fill openapi/ — so
    openapi/ is deliberately absent and apis[] is deliberately empty.
