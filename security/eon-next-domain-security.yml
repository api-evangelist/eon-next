source: >-
  live DNS/TLS/HTTP probes of the apis.yml hosts
  (0-working/probe-domain-security.py), extended by hand on the same date with
  `curl -sI`, `openssl s_client` and `dig` for the four hosts the script does not
  reach from apis.yml alone — api.eonnext.com, data.eonnext.com,
  auth.eonnext.com and community.eonnext.com. Observed header values are recorded
  verbatim; absence of a record is real data, not a gap in the probe.
description: >-
  Every E.ON Next host negotiates TLS 1.3 with a valid certificate, and the
  domain is registered on AWS Route 53. The weak spots are policy rather than
  transport: eonnext.com publishes no CAA record, no DNSSEC, and a DMARC record
  whose policy is p=none (monitor only, nothing quarantined or rejected). HSTS is
  served only by the Auth0-fronted identity host; the marketing/account site on
  S3 and both AWS API Gateway hosts send no Strict-Transport-Security header at
  all.
