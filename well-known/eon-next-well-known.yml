source: >-
  Live anonymous HTTPS probes on 2026-07-27 of every E.ON Next host that
  resolves — www.eonnext.com, eonnext.com, api.eonnext.com, data.eonnext.com,
  auth.eonnext.com and community.eonnext.com — plus the E.ON group corporate host
  www.eon.com. Every path below was requested with curl, User-Agent Mozilla/5.0,
  redirects followed; the observed HTTP status is recorded verbatim, including
  the misses.
description: >-
  E.ON Next publishes two real /.well-known/ surfaces, on two different hosts,
  and neither of them is a developer-facing one. www.eonnext.com serves an
  RFC 9116 security.txt (PGP-signed, the E.ON group security contact). The
  discovery find of this round is auth.eonnext.com — the E.ON customer identity
  and access management tenant, an Auth0 custom domain (certificate CN
  eon-next-uk.eon-ciam.auth0app.com, Cloudflare edge) — which serves a complete,
  anonymous OpenID Connect discovery document, the RFC 8414 authorization-server
  metadata alias of it, and the signing JWKS. That is a real machine-readable
  contract for E.ON Next's customer sign-in surface, and it was missed by the
  first round because only www and api were probed. It does not change the
  finding that there is no public developer programme: api.eonnext.com and
  data.eonnext.com answer every /.well-known/ path with the AWS API Gateway
  {"message":"Missing Authentication Token"} 403, and no api-catalog, ai-plugin
  or oauth-protected-resource document exists on any host.
